<!-- Decorative placeholders stay separate from the live loading sentence. -->
<div aria-busy="true" aria-live="polite" data-adapttable-part="loading">
  @if (variant() === "table") {
    <nz-table
      data-adapttable-part="loading-table"
      aria-hidden="true"
      nzSize="small"
      [nzData]="rowKeys()"
      [nzFrontPagination]="false"
      [nzShowPagination]="false"
      [nzTemplateMode]="true"
    >
      <thead>
        <tr data-adapttable-part="loading-header-row">
          @for (column of columnKeys(); track column) {
            <th scope="col" data-adapttable-part="loading-header-cell">
              <nz-skeleton-element
                data-adapttable-part="loading-line"
                nzType="input"
                nzSize="small"
                [nzActive]="true"
                [nzBlock]="true"
                [style.width]="lineWidth(column)"
              ></nz-skeleton-element>
            </th>
          }
        </tr>
      </thead>
      <tbody>
        @for (row of rowKeys(); track row) {
          <tr data-adapttable-part="loading-row">
            @for (column of columnKeys(); track column) {
              <td data-adapttable-part="loading-cell">
                <nz-skeleton-element
                  data-adapttable-part="loading-line"
                  nzType="input"
                  nzSize="small"
                  [nzActive]="true"
                  [nzBlock]="true"
                  [style.width]="lineWidth(column)"
                ></nz-skeleton-element>
              </td>
            }
          </tr>
        }
      </tbody>
    </nz-table>
  } @else {
    <div aria-hidden="true" data-adapttable-part="loading-cards">
      @for (row of rowKeys(); track row) {
        <nz-card nzSize="small" data-adapttable-part="loading-card">
          @for (column of cardColumns(); track column) {
            <nz-skeleton-element
              data-adapttable-part="loading-line"
              nzType="input"
              nzSize="small"
              [nzActive]="true"
              [nzBlock]="true"
              [style.width]="lineWidth(column)"
            ></nz-skeleton-element>
          }
        </nz-card>
      }
    </div>
  }
  <span
    style="
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    "
    >{{ labels().loading }}</span
  >
</div>
